[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "odoo-accounting-cli-v3"
dynamic = ["version"]
description = "Controlled Odoo 19 accounting capability gateway for Pi Agent"
requires-python = ">=3.11"
dependencies = ["click>=8.1,<9"]

[project.scripts]
odoo-accounting-cli-v3 = "odoo_accounting_cli_v3.cli:main"
odoo-accounting-cli-v3-broker = "odoo_accounting_cli_v3.trusted_broker_main:main"
odoo-accounting-cli-v3-effect-finalizer = "odoo_accounting_cli_v3.effect_finalizer_main:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/odoo_accounting_cli_v3"]

[tool.hatch.build.targets.wheel.force-include]
"registry/capabilities.json" = "odoo_accounting_cli_v3/data/capabilities.json"

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>.+)$"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
