[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "odoo-accounting-cli-v3"
dynamic = ["version"]
description = "Controlled Odoo 19 accounting capability gateway for Pi Agent"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/odoo_accounting_cli_v3"]

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>.+)$"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
