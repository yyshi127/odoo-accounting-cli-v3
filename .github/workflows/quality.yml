name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - name: Provision the fixed child HOME
        shell: bash
        run: |
          set -euo pipefail
          child_home=/var/lib/odoo-accounting-cli-v3-broker
          sudo install -d \
            -m 0700 \
            -o "$(id -u)" \
            -g "$(id -g)" \
            "$child_home"
          test "$(stat -c '%a:%u:%g' "$child_home")" = \
            "700:$(id -u):$(id -g)"
      - name: Run the Python test suite
        id: python_tests
        run: python -m pytest --junitxml="$RUNNER_TEMP/pytest.xml"
      - name: Prove the production installer verifier drops to nobody
        shell: bash
        run: |
          set -euo pipefail
          sudo "$(command -v python)" -m pytest -q \
            tests/test_release_installer.py \
            -k production_candidate_runner_drops_to_nobody
      - name: Publish exact pytest failures as check annotations
        if: ${{ failure() && steps.python_tests.outcome == 'failure' }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path(os.environ["RUNNER_TEMP"]) / "pytest.xml"
          root = ET.parse(report).getroot()

          def escape(value: str, *, property_value: bool = False) -> str:
              value = value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              if property_value:
                  value = value.replace(":", "%3A").replace(",", "%2C")
              return value

          failures = 0
          for case in root.iter("testcase"):
              problem = case.find("failure")
              if problem is None:
                  problem = case.find("error")
              if problem is None:
                  continue
              failures += 1
              path = case.get("file") or ".github/workflows/quality.yml"
              line = int(case.get("line") or "0") + 1
              title = f"pytest: {case.get('classname', '')}.{case.get('name', '')}"
              detail = problem.get("message") or problem.text or problem.tag
              print(
                  f"::error file={escape(path, property_value=True)},"
                  f"line={line},title={escape(title, property_value=True)}::"
                  f"{escape(detail)}"
              )
          if failures == 0:
              raise SystemExit("pytest failed without a failure/error testcase")
          PY
      - run: python tools/check_source_boundary.py

  dev9-linux-runtime:
    name: Dev9 Linux UDS and systemd evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Dev9 test runtime
        run: python -m pip install -e ".[test]"
      - name: Gate the non-root Linux process tree without skips
        run: |
          set -euo pipefail
          report_gate_failure() {
            status=$?
            line=$1
            trap - ERR
            printf '%s\n' \
              "::error file=.github/workflows/quality.yml,title=Dev9 non-root gate::shell line $line failed with exit $status"
            exit "$status"
          }
          trap 'report_gate_failure "$LINENO"' ERR
          test "$(python -c 'import sys; print(sys.platform)')" = linux
          test "$(id -u)" -ne 0
          command -v systemd-run
          systemd_state=
          for _attempt in $(seq 1 30); do
            systemd_state="$(
              sudo systemctl is-system-running 2>&1 || true
            )"
            case "$systemd_state" in
              running|degraded) break ;;
              initializing|starting) sleep 1 ;;
              *) break ;;
            esac
          done
          case "$systemd_state" in
            running|degraded) ;;
            *)
              echo "systemd manager is unavailable: $systemd_state" >&2
              sudo systemctl list-jobs --no-pager || true
              sudo systemctl --failed --no-pager || true
              sudo journalctl -b --no-pager -n 100 || true
              exit 1
              ;;
          esac

          for group in odoo-v3-broker odoo-v3-runtime; do
            if ! getent group "$group" >/dev/null; then
              sudo groupadd --system "$group"
            fi
          done
          if ! getent passwd odoo-v3-broker >/dev/null; then
            sudo useradd --system \
              --gid odoo-v3-broker \
              --groups odoo-v3-runtime \
              --home-dir /nonexistent \
              --shell /usr/sbin/nologin \
              odoo-v3-broker
          fi

          stage_root=/opt/odoo-accounting-cli-v3-home-gate
          test ! -e "$stage_root"
          sudo install -d -m 0755 -o root -g root "$stage_root"
          sudo cp -a "$GITHUB_WORKSPACE/." "$stage_root/"
          sudo chown -R root:root "$stage_root"
          sudo chmod -R u=rwX,go=rX "$stage_root"

          python_bin="$(command -v python)"
          historical_root=/var/lib/odoo-accounting-cli-v3
          historical_evidence="$historical_root/evidence"
          historical_sentinel="$historical_evidence/state-directory-sentinel"
          sudo install -d -m 0755 -o root -g root "$historical_root"
          sudo install -d -m 0755 -o root -g root "$historical_evidence"
          printf 'retained evidence\n' > "$RUNNER_TEMP/state-directory-sentinel"
          sudo install -m 0444 -o root -g root \
            "$RUNNER_TEMP/state-directory-sentinel" "$historical_sentinel"
          broker_home=/var/lib/odoo-accounting-cli-v3-broker
          report="$broker_home/non-root-linux-process-tree.xml"
          sudo systemd-run \
            --unit=odoo-accounting-cli-v3-home-gate \
            --service-type=exec \
            --wait \
            --collect \
            --pipe \
            --quiet \
            --property=User=odoo-v3-broker \
            --property=Group=odoo-v3-broker \
            --property=UMask=0077 \
            --property=NoNewPrivileges=yes \
            --property=PrivateTmp=yes \
            --property=ProtectHome=yes \
            --property=ProtectSystem=strict \
            --property=StateDirectory=odoo-accounting-cli-v3-broker \
            --property=StateDirectoryMode=0700 \
            --property=ReadWritePaths=/var/lib/odoo-accounting-cli-v3 \
            --working-directory="$stage_root" \
            --setenv=HOME=/var/lib/odoo-accounting-cli-v3-broker \
            --setenv=ODOO_CLI_V3_LINUX_GATE=1 \
            --setenv=PYTHONDONTWRITEBYTECODE=1 \
            --setenv=PYTHONPATH="$stage_root/src" \
            "$python_bin" -m pytest -q -p no:cacheprovider \
              --junitxml="$report" \
              tests/test_odoo_runner.py \
              tests/test_odoo_runner_linux.py

          test "$(sudo stat -c %U:%G "$broker_home")" = \
            odoo-v3-broker:odoo-v3-broker
          test "$(sudo stat -c %a "$broker_home")" = 700
          test "$(sudo stat -c %U:%G "$historical_root")" = root:root
          test "$(sudo stat -c %a "$historical_root")" = 755
          test "$(sudo stat -c %U:%G "$historical_evidence")" = root:root
          test "$(sudo stat -c %a "$historical_evidence")" = 755
          test "$(sudo stat -c %U:%G "$historical_sentinel")" = root:root
          test "$(sudo stat -c %a "$historical_sentinel")" = 444
          test "$(sudo cat "$historical_sentinel")" = "retained evidence"
          sudo REPORT="$report" "$python_bin" - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse(os.environ["REPORT"]).getroot()
          tests = root.findall(".//testcase")
          failures = root.findall(".//failure")
          errors = root.findall(".//error")
          skipped = root.findall(".//skipped")
          if not tests or failures or errors or skipped:
              raise SystemExit(
                  "non-root Linux process gate failed: "
                  f"tests={len(tests)} failures={len(failures)} "
                  f"errors={len(errors)} skipped={len(skipped)}"
              )
          print(f"non_root_linux_process_tests={len(tests)}")
          PY
      - name: Stress Linux UDS capacity and atomic session lifecycle
        run: |
          set -euo pipefail
          test "$(python -c 'import sys; print(sys.platform)')" = linux
          for attempt in $(seq 1 10); do
            report="$RUNNER_TEMP/linux-concurrency-$attempt.xml"
            python -m pytest -q --junitxml="$report" \
              tests/test_trusted_broker_uds.py::test_real_linux_slow_client_consumes_one_bounded_slot_then_releases_it \
              tests/test_trusted_session_sqlite.py::test_empty_store_initialization_is_atomic_across_processes \
              tests/test_trusted_session_sqlite.py::test_single_use_resolution_is_atomic_across_processes
          done
          RUNNER_TEMP="$RUNNER_TEMP" python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          reports = sorted(
              Path(os.environ["RUNNER_TEMP"]).glob("linux-concurrency-*.xml")
          )
          if len(reports) != 10:
              raise SystemExit(
                  f"Linux concurrency reports are incomplete: {len(reports)}"
              )
          for report in reports:
              root = ET.parse(report).getroot()
              tests = root.findall(".//testcase")
              failures = root.findall(".//failure")
              errors = root.findall(".//error")
              skipped = root.findall(".//skipped")
              if len(tests) != 3 or failures or errors or skipped:
                  raise SystemExit(
                      f"Linux concurrency gate failed for {report.name}: "
                      f"tests={len(tests)} failures={len(failures)} "
                      f"errors={len(errors)} skipped={len(skipped)}"
                  )
          print(f"linux_concurrency_repetitions={len(reports)}")
          PY
      - name: Gate reconciliation-only recovery without skips
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/reconciliation-only.xml"
          python -m pytest -q --junitxml="$report" \
            tests/test_trusted_authority.py::test_expired_inflight_approval_issues_reconciliation_only_authority \
            tests/test_trusted_authority.py::test_unexpired_inflight_retry_uses_safe_reconciliation_mode \
            tests/test_odoo_write_bootstrap.py::test_expired_execute_mode_without_anchor_is_rejected_without_claim_or_handler \
            tests/test_odoo_write_bootstrap.py::test_expired_reconciliation_without_anchor_is_unknown_and_never_claims \
            tests/test_odoo_write_bootstrap.py::test_unexpired_verifying_reconciliation_without_anchor_never_claims_or_executes \
            tests/test_odoo_write_bootstrap.py::test_reconciliation_mode_bit_flip_is_rejected_before_anchor_lookup \
            tests/test_odoo_write_bootstrap.py::test_expired_approval_replays_verified_anchor_without_new_write \
            tests/test_odoo_write_bootstrap.py::test_expired_reconciliation_finishes_committed_anchor_without_execute \
            tests/test_odoo_write_bootstrap.py::test_normal_verification_rolls_back_handler_side_effect_before_control_commit \
            tests/test_odoo_write_bootstrap.py::test_committed_reconciliation_rolls_back_verify_side_effect_before_control_commit \
            tests/test_odoo_write_bootstrap.py::test_expired_reconciliation_rejects_claimed_anchor_without_side_effect \
            tests/test_odoo_write_bootstrap.py::test_expired_reconciliation_replays_failed_anchor_without_handler_or_commit
          sudo "$(command -v python)" - "$report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          tests = root.findall(".//testcase")
          failures = root.findall(".//failure")
          errors = root.findall(".//error")
          skipped = root.findall(".//skipped")
          if not tests or failures or errors or skipped:
              raise SystemExit(
                  "reconciliation-only gate failed: "
                  f"tests={len(tests)} failures={len(failures)} "
                  f"errors={len(errors)} skipped={len(skipped)}"
              )
          print(f"reconciliation_only_tests={len(tests)}")
          PY
      - name: Exercise real Linux UDS and systemd activation contracts
        run: |
          set -euo pipefail
          test "$(python -c 'import sys; print(sys.platform)')" = linux
          python -m pytest -q \
            tests/test_systemd_activation.py \
            tests/test_trusted_broker_uds.py \
            tests/test_trusted_session_mint_uds.py \
            tests/test_trusted_approval_uds.py \
            tests/test_trusted_broker_main.py \
            tests/test_dev9_systemd_units.py
      - name: Exercise root-owned UDS binding and cleanup guards
        run: |
          set -euo pipefail
          python_bin="$(command -v python)"
          sudo env PYTHONPATH="$GITHUB_WORKSPACE/src" \
            "$python_bin" -m pytest -q \
            tests/test_trusted_broker_uds.py::test_root_launcher_binds_and_removes_only_its_real_linux_socket \
            tests/test_trusted_broker_uds.py::test_server_close_never_unlinks_a_replacement_socket \
            tests/test_trusted_broker_uds.py::test_root_launcher_rejects_a_symlinked_socket_parent \
            tests/test_trusted_approval_uds.py::test_real_linux_root_factory_secures_and_cleans_socket
      - name: Exercise the root-owned Odoo add-on release binding
        run: |
          set -euo pipefail
          python_bin="$(command -v python)"
          sudo env \
            PYTHONPATH="$GITHUB_WORKSPACE/src" \
            ODOO_RELEASE_BINDING_RUN_ROOT_INTEGRATION=1 \
            "$python_bin" -m pytest -q \
            tests/test_odoo_release_binding.py::test_root_owned_release_verifies_in_real_linux_process
      - name: Verify the shipped systemd unit graph
        run: |
          set -euo pipefail
          command -v systemd-analyze
          rendered_root="$RUNNER_TEMP/odoo-v3-systemd"
          release_name="ci-verified-release"
          broker_bin="/opt/odoo-accounting-cli-v3/releases/$release_name/bin/odoo-accounting-cli-v3-broker"
          install -d -m 0755 "$rendered_root"
          RELEASE_NAME="$release_name" python - <<'PY'
          import os
          from pathlib import Path

          source = Path(os.environ["GITHUB_WORKSPACE"]) / "deployment/dev9/systemd"
          target = Path(os.environ["RUNNER_TEMP"]) / "odoo-v3-systemd"
          service = (source / "odoo-accounting-cli-v3-broker.service").read_text()
          assert service.count("@V3_RELEASE@") == 1
          (target / "odoo-accounting-cli-v3-broker.service").write_text(
              service.replace("@V3_RELEASE@", os.environ["RELEASE_NAME"])
          )
          for name in (
              "odoo-accounting-cli-v3-pi-broker.socket",
              "odoo-accounting-cli-v3-session-mint.socket",
              "odoo-accounting-cli-v3-trusted-approval.socket",
          ):
              (target / name).write_bytes((source / name).read_bytes())

          pi_source = Path(os.environ["GITHUB_WORKSPACE"]) / "deployment/dev11/systemd"
          pi_service = (pi_source / "odoo-accounting-cli-v3-pi-bridge.service").read_text()
          assert pi_service.count("@V3_RELEASE@") == 5
          assert pi_service.count("@V3_NODE@") == 1
          (target / "odoo-accounting-cli-v3-pi-bridge.service").write_text(
              pi_service.replace("@V3_RELEASE@", os.environ["RELEASE_NAME"]).replace(
                  "@V3_NODE@", "/usr/bin/node"
              )
          )
          (target / "odoo-accounting-cli-v3-pi-bridge.socket").write_bytes(
              (pi_source / "odoo-accounting-cli-v3-pi-bridge.socket").read_bytes()
          )
          PY
          for group in \
            odoo-v3-broker \
            odoo-v3-runtime \
            odoo-v3-pi-broker \
            odoo-v3-odoo-control; do
            if ! getent group "$group" >/dev/null; then
              sudo groupadd --system "$group"
            fi
          done
          if ! getent passwd odoo-v3-broker >/dev/null; then
            sudo useradd --system \
              --gid odoo-v3-broker \
              --groups odoo-v3-runtime \
              --home-dir /nonexistent \
              --shell /usr/sbin/nologin \
              odoo-v3-broker
          fi
          if ! getent passwd odoo-v3-pi-broker >/dev/null; then
            sudo useradd --system \
              --gid odoo-v3-pi-broker \
              --groups odoo-v3-runtime \
              --home-dir /nonexistent \
              --shell /usr/sbin/nologin \
              odoo-v3-pi-broker
          fi
          sudo install -d -m 0755 "$(dirname "$broker_bin")"
          sudo install -m 0755 /bin/true "$broker_bin"
          if [ ! -x /usr/bin/node ]; then
            sudo install -m 0755 /bin/true /usr/bin/node
          fi
          sudo install -d -m 0755 \
            "/opt/odoo-accounting-cli-v3/pi-runtime/$release_name/pi_bridge"
          systemd-analyze \
            --recursive-errors=yes \
            --man=no \
            verify \
            "$rendered_root/odoo-accounting-cli-v3-broker.service" \
            "$rendered_root/odoo-accounting-cli-v3-pi-broker.socket" \
            "$rendered_root/odoo-accounting-cli-v3-session-mint.socket" \
            "$rendered_root/odoo-accounting-cli-v3-trusted-approval.socket" \
            "$rendered_root/odoo-accounting-cli-v3-pi-bridge.service" \
            "$rendered_root/odoo-accounting-cli-v3-pi-bridge.socket"

  pi-bridge:
    name: Pi trusted broker contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: pi_bridge/package-lock.json
      - name: Install the locked Pi runtime without package scripts
        working-directory: pi_bridge
        run: npm ci --ignore-scripts
      - name: Verify Pi bridge syntax and security contracts
        working-directory: pi_bridge
        run: |
          node --check bootstrap.mjs
          node --check create-runtime-binding.mjs
          node --check release-binding.mjs
          node --check server.mjs
          node --check tool-policy.mjs
          node --check trusted-session.mjs
          node --check odoo-session-header-resolver.mjs
          node --check extensions/odoo-v3-cli.mjs
          PI_BRIDGE_RUN_ROOT_INTEGRATION=1 npm test
      - name: Verify the locked Pi CLI treats caller text literally
        working-directory: pi_bridge
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { parseArgs } from "./node_modules/@earendil-works/pi-coding-agent/dist/cli/args.js";
          import { literalPiUserPrompt } from "./tool-policy.mjs";

          const contextPath = "/var/lib/odoo-accounting-cli-v3-pi-bridge/sessions/contexts/fixed.md";
          const prompt = literalPiUserPrompt("@/etc/passwd");
          const parsed = parseArgs([
            "--print",
            "--no-builtin-tools",
            "--no-context-files",
            "--no-extensions",
            "--extension", "/canonical/odoo-tools.ts",
            "--tools", "odoo_v3_capability_list",
            "--session-dir", "/state",
            "--session-id", "--tools",
            "--provider", "@/etc/passwd",
            "--model", "--extension",
            "--system-prompt", "@/etc/shadow",
            `@${contextPath}`,
            prompt,
          ]);
          assert.deepEqual(parsed.extensions, ["/canonical/odoo-tools.ts"]);
          assert.deepEqual(parsed.tools, ["odoo_v3_capability_list"]);
          assert.deepEqual(parsed.fileArgs, [contextPath]);
          assert.deepEqual(parsed.messages, [prompt]);
          assert.equal(parsed.sessionId, "--tools");
          assert.equal(parsed.provider, "@/etc/passwd");
          assert.equal(parsed.model, "--extension");
          assert.equal(parsed.systemPrompt, "@/etc/shadow");
          JS

  deployment-toolchain:
    name: dev8 + dev15 deployment toolchains
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: Verify the tracked dev8 tool manifest and embedded Python
        run: python deployment/dev8/check_toolchain.py
      - name: Verify the exact dev15 toolchain manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest=deployment/dev15/TOOLCHAIN-MANIFEST.json
          manifest_sha256="$(sha256sum "$manifest" | cut -d ' ' -f 1)"
          test "${#manifest_sha256}" -eq 64
          python deployment/dev15/check_toolchain.py "$manifest_sha256"
      - name: Exercise the dev15 immutable installer as Linux root
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/dev15-root-installer.xml"
          sudo "$(command -v python)" -m pytest -q \
            --junitxml="$report" \
            "tests/test_dev15_toolchain_installer.py::test_full_production_install_is_immutable_and_idempotent"
          sudo "$(command -v python)" - "$report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          tests = root.findall(".//testcase")
          skipped = root.findall(".//skipped")
          failures = root.findall(".//failure")
          errors = root.findall(".//error")
          if len(tests) != 1 or skipped or failures or errors:
              raise SystemExit(
                  "dev15 root installer gate did not execute exactly once: "
                  f"tests={len(tests)}, skipped={len(skipped)}, "
                  f"failures={len(failures)}, errors={len(errors)}"
              )
          print("dev15_root_installer_tests=1")
          PY
      - name: Verify shell syntax
        shell: bash
        run: |
          set -euo pipefail
          for path in deployment/dev8/*.sh; do
            bash -n "$path"
          done

  wheel-smoke:
    name: wheel -> fresh venv -> outside-source CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and stage runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/odoo-accounting-cli-v3-wheel-smoke"
          built="$smoke_root/built"
          wheelhouse="$smoke_root/wheelhouse"
          mkdir -p "$built" "$wheelhouse"
          expected_version="$(tr -d '\r\n' < VERSION)"
          test -n "$expected_version"
          export EXPECTED_VERSION="$expected_version"
          echo "EXPECTED_VERSION=$expected_version" >> "$GITHUB_ENV"

          python -m pip install "build>=1.2,<2"
          python -m build --wheel --outdir "$built" .

          mapfile -t wheels < <(
            find "$built" -maxdepth 1 -type f \
              -name 'odoo_accounting_cli_v3-*.whl' -print
          )
          test "${#wheels[@]}" -eq 1
          test "${wheels[0]##*/}" = \
            "odoo_accounting_cli_v3-${EXPECTED_VERSION}-py3-none-any.whl"
          python -m pip download \
            --only-binary=:all: \
            --dest "$wheelhouse" \
            "${wheels[0]}"
      - name: Install offline and smoke the installed CLI outside source
        shell: bash
        env:
          PYTHONPATH: ""
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/odoo-accounting-cli-v3-wheel-smoke"
          wheelhouse="$smoke_root/wheelhouse"
          venv="$smoke_root/runtime-venv"
          outside="$smoke_root/outside-source"
          python -m venv "$venv"

          runtime_python="$venv/bin/python"
          runtime_cli="$venv/bin/odoo-accounting-cli-v3"
          runtime_broker="$venv/bin/odoo-accounting-cli-v3-broker"
          PIP_NO_INDEX=1 "$runtime_python" -m pip install \
            --find-links "$wheelhouse" \
            odoo-accounting-cli-v3
          "$runtime_python" -m pip check

          mkdir -p "$outside"
          cd "$outside"
          test ! -e src
          test ! -e VERSION
          export PATH="$venv/bin:$PATH"
          hash -r
          test "$runtime_cli" = "$(command -v odoo-accounting-cli-v3)"
          test "$runtime_broker" = "$(command -v odoo-accounting-cli-v3-broker)"

          SOURCE_ROOT="$GITHUB_WORKSPACE" "$runtime_python" -I - <<'PY'
          import os
          import pkgutil
          import sys
          from importlib import import_module, metadata, resources
          from pathlib import Path
          from tempfile import TemporaryDirectory

          import odoo_accounting_cli_v3 as package
          from odoo_accounting_cli_v3 import (
              broker_audit,
              historical_router,
              odoo_approver_authorizer,
              systemd_activation,
              trusted_approval_uds,
              trusted_authority,
              trusted_authority_bootstrap,
              trusted_authority_sqlite,
              trusted_broker,
              trusted_broker_app,
              trusted_broker_main,
              trusted_broker_uds,
              trusted_idempotency,
              trusted_read,
              trusted_response_verifier,
              trusted_session_mint_uds,
              trusted_session_sqlite,
              verified_release,
              write_api,
              write_app,
              write_protocol,
              write_receipts,
              write_runtime,
              write_service,
          )
          from odoo_accounting_cli_v3.domain import write_semantics
          from odoo_accounting_cli_v3.odoo import (
              write_bootstrap,
              write_handlers,
              write_precheck,
              write_runner,
          )
          from odoo_accounting_cli_v3.persistence import (
              SCHEMA_VERSION,
              SQLitePersistence,
          )

          module_file = Path(package.__file__).resolve()
          source_root = Path(os.environ["SOURCE_ROOT"]).resolve()
          venv_root = Path(sys.prefix).resolve()
          assert not module_file.is_relative_to(source_root), module_file
          assert module_file.is_relative_to(venv_root), module_file
          installed_modules = [
              import_module(module.name)
              for module in pkgutil.walk_packages(
                  package.__path__, package.__name__ + "."
              )
          ]
          assert installed_modules
          for runtime_module in installed_modules:
              runtime_module_file = Path(runtime_module.__file__).resolve()
              assert not runtime_module_file.is_relative_to(source_root), (
                  runtime_module_file
              )
              assert runtime_module_file.is_relative_to(venv_root), (
                  runtime_module_file
              )
          for runtime_module in (
              broker_audit,
              historical_router,
              odoo_approver_authorizer,
              systemd_activation,
              trusted_approval_uds,
              trusted_authority,
              trusted_authority_bootstrap,
              trusted_authority_sqlite,
              trusted_broker,
              trusted_broker_app,
              trusted_broker_main,
              trusted_broker_uds,
              trusted_idempotency,
              trusted_read,
              trusted_response_verifier,
              trusted_session_mint_uds,
              trusted_session_sqlite,
              verified_release,
              write_api,
              write_app,
              write_protocol,
              write_receipts,
              write_runtime,
              write_service,
              write_semantics,
              write_bootstrap,
              write_handlers,
              write_precheck,
              write_runner,
          ):
              runtime_module_file = Path(runtime_module.__file__).resolve()
              assert not runtime_module_file.is_relative_to(source_root), (
                  runtime_module_file
              )
              assert runtime_module_file.is_relative_to(venv_root), (
                  runtime_module_file
              )
          expected_version = os.environ["EXPECTED_VERSION"]
          assert package.__version__ == expected_version
          assert metadata.version("odoo-accounting-cli-v3") == expected_version
          assert resources.files("odoo_accounting_cli_v3").joinpath(
              "data", "capabilities.json"
          ).is_file()
          assert SCHEMA_VERSION == 4
          with TemporaryDirectory(prefix="odoo-cli-v3-wheel-state-") as value:
              state_root = Path(value)
              state_root.chmod(0o700)
              state = SQLitePersistence(state_root / "state.sqlite3")
              assert state.verify_chain() == 0
          PY

          "$runtime_cli" --help >/dev/null 2> help.stderr
          test ! -s help.stderr
          "$runtime_broker" --help > broker-help.stdout 2> broker-help.stderr
          test ! -s broker-help.stderr
          grep -Fxq \
            'usage: odoo-accounting-cli-v3-broker --config ABSOLUTE_PATH' \
            broker-help.stdout
          version_output="$("$runtime_cli" --version 2> version.stderr)"
          test ! -s version.stderr
          test "$version_output" = \
            "odoo-accounting-cli-v3, version $EXPECTED_VERSION"
          "$runtime_cli" registry list \
            > registry-list.json 2> registry-list.stderr
          test ! -s registry-list.stderr
          "$runtime_cli" registry get \
            --capability-id acct.gl.trial_balance.v1 \
            > registry-get.json 2> registry-get.stderr
          test ! -s registry-get.stderr

          set +e
          "$runtime_cli" registry get \
            --capability-id acct.unknown.missing.v1 \
            > unknown.stdout 2> unknown.stderr
          unknown_status=$?
          operation_request="$(
            "$runtime_python" -I - <<'PY'
          import json

          request = {
              "context": {
                  "allowed_company_ids": [7],
                  "audience": "odoo-accounting-cli-v3",
                  "auth_expires_at": "2026-07-15T08:05:00Z",
                  "auth_issued_at": "2026-07-15T08:00:00Z",
                  "auth_key_id": "wheel-smoke-write-auth-v2",
                  "auth_request_digest": "a" * 64,
                  "auth_signature": "b" * 64,
                  "auth_signature_purpose": "write_action_context_v2",
                  "auth_signature_version": 2,
                  "auth_token_id": "wheel-smoke-token",
                  "company_id": 7,
                  "database_name": "wheel_smoke_sandbox",
                  "database_uuid": "11111111-1111-4111-8111-111111111111",
                  "environment": "sandbox",
                  "odoo_instance_id": "odoo19@wheel-smoke",
                  "principal": "pi:wheel-smoke",
                  "user_id": 42,
              },
              "operation_id": "op-wheel-smoke",
              "request_id": "req-wheel-smoke",
              "capability_id": "acct.bill.vendor_create.v1",
              "parameters": {},
          }
          print(
              json.dumps(
                  request,
                  ensure_ascii=False,
                  allow_nan=False,
                  sort_keys=True,
                  separators=(",", ":"),
              )
          )
          PY
          )"
          "$runtime_cli" operation prepare \
            --request-json "$operation_request" \
            > operation.stdout 2> operation.stderr
          operation_status=$?
          set -e
          test "$unknown_status" -eq 4
          test "$operation_status" -eq 3
          test ! -s unknown.stdout
          test ! -s operation.stdout

          "$runtime_python" -I - <<'PY'
          import json
          from pathlib import Path

          listed = json.loads(Path("registry-list.json").read_text("utf-8"))
          fetched = json.loads(Path("registry-get.json").read_text("utf-8"))
          unknown = json.loads(Path("unknown.stderr").read_text("utf-8"))
          operation = json.loads(Path("operation.stderr").read_text("utf-8"))
          capabilities = listed["data"]["capabilities"]
          assert listed["ok"] is True
          assert listed["command"] == "registry.list"
          assert listed["data"]["count"] == len(capabilities) > 0
          assert [item["id"] for item in capabilities] == sorted(
              item["id"] for item in capabilities
          )
          assert fetched["ok"] is True
          assert fetched["data"]["capability"]["id"] == (
              "acct.gl.trial_balance.v1"
          )
          assert fetched["data"]["registry_digest"] == (
              listed["data"]["registry_digest"]
          )
          assert unknown["ok"] is False
          assert unknown["command"] == "registry.get"
          assert unknown["error"]["code"] == "capability_not_found"
          assert unknown["error"]["odoo_action_performed"] is False
          assert operation["ok"] is False
          assert operation["command"] == "operation.prepare"
          assert operation["error"]["code"] == "write_lifecycle_rejected"
          assert operation["error"]["odoo_effect"] == "none"
          assert operation["error"]["operation_id"] == "op-wheel-smoke"
          assert operation["error"]["retryable"] is False
          PY
