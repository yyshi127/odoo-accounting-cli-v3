name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - name: Gate trusted Odoo reads against write escapes
        run: python -m pytest -q tests/test_read_handler_static_safety.py
      - name: Provision the fixed child HOME
        shell: bash
        run: |
          set -euo pipefail
          child_home=/var/lib/odoo-accounting-cli-v3-broker
          sudo install -d \
            -m 0700 \
            -o "$(id -u)" \
            -g "$(id -g)" \
            "$child_home"
          test "$(stat -c '%a:%u:%g' "$child_home")" = \
            "700:$(id -u):$(id -g)"
      - name: Run the Python test suite
        id: python_tests
        run: python -m pytest --junitxml="$RUNNER_TEMP/pytest.xml"
      - name: Prove the production installer verifier drops to nobody
        shell: bash
        run: |
          set -euo pipefail
          sudo "$(command -v python)" -m pytest -q \
            tests/test_release_installer.py \
            -k production_candidate_runner_drops_to_nobody
      - name: Publish exact pytest failures as check annotations
        if: ${{ failure() && steps.python_tests.outcome == 'failure' }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path(os.environ["RUNNER_TEMP"]) / "pytest.xml"
          root = ET.parse(report).getroot()

          def escape(value: str, *, property_value: bool = False) -> str:
              value = value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              if property_value:
                  value = value.replace(":", "%3A").replace(",", "%2C")
              return value

          failures = 0
          for case in root.iter("testcase"):
              problem = case.find("failure")
              if problem is None:
                  problem = case.find("error")
              if problem is None:
                  continue
              failures += 1
              path = case.get("file") or ".github/workflows/quality.yml"
              line = int(case.get("line") or "0") + 1
              title = f"pytest: {case.get('classname', '')}.{case.get('name', '')}"
              detail = problem.get("message") or problem.text or problem.tag
              print(
                  f"::error file={escape(path, property_value=True)},"
                  f"line={line},title={escape(title, property_value=True)}::"
                  f"{escape(detail)}"
              )
          if failures == 0:
              raise SystemExit("pytest failed without a failure/error testcase")
          PY
      - run: python tools/check_source_boundary.py

  dev9-linux-runtime:
    name: Dev9 Linux UDS and systemd evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Dev9 test runtime
        run: python -m pip install -e ".[test]"
      - name: Gate the non-root Linux process tree without skips
        run: |
          set -euo pipefail
          report_gate_failure() {
            status=$?
            line=$1
            trap - ERR
            printf '%s\n' \
              "::error file=.github/workflows/quality.yml,title=Dev9 non-root gate::shell line $line failed with exit $status"
            exit "$status"
          }
          trap 'report_gate_failure "$LINENO"' ERR
          test "$(python -c 'import sys; print(sys.platform)')" = linux
          test "$(id -u)" -ne 0
          command -v systemd-run
          systemd_state=
          systemd_previous=
          systemd_attempts=0
          systemd_started=$SECONDS
          for _attempt in $(seq 1 90); do
            systemd_attempts=$_attempt
            systemd_state="$(
              sudo systemctl is-system-running 2>&1 || true
            )"
            if [[ "$systemd_state" != "$systemd_previous" ]]; then
              printf 'systemd readiness state=%q attempt=%s elapsed_seconds=%s\n' \
                "$systemd_state" "$systemd_attempts" \
                "$((SECONDS - systemd_started))"
              systemd_previous=$systemd_state
            fi
            case "$systemd_state" in
              running|degraded) break ;;
              initializing|starting)
                if (( _attempt < 90 )); then
                  sleep 1
                fi
                ;;
              *) break ;;
            esac
          done
          case "$systemd_state" in
            running|degraded) ;;
            *)
              annotation_state=$systemd_state
              case "$annotation_state" in
                ""|*[!A-Za-z0-9_.-]*) annotation_state=unexpected-output ;;
              esac
              printf 'systemd readiness failed: final_state=%q attempts=%s elapsed_seconds=%s\n' \
                "$systemd_state" "$systemd_attempts" \
                "$((SECONDS - systemd_started))" >&2
              printf '%s\n' \
                "::error file=.github/workflows/quality.yml,title=Dev9 systemd readiness::systemd did not reach running/degraded; final_state=$annotation_state attempts=$systemd_attempts elapsed_seconds=$((SECONDS - systemd_started))"
              sudo systemctl list-jobs --no-pager || true
              sudo systemctl --failed --no-pager || true
              sudo journalctl -b --no-pager -n 100 || true
              exit 1
              ;;
          esac

          for group in odoo-v3-broker odoo-v3-runtime; do
            if ! getent group "$group" >/dev/null; then
              sudo groupadd --system "$group"
            fi
          done
          if ! getent passwd odoo-v3-broker >/dev/null; then
            sudo useradd --system \
              --gid odoo-v3-broker \
              --groups odoo-v3-runtime \
              --home-dir /nonexistent \
              --shell /usr/sbin/nologin \
              odoo-v3-broker
          fi

          stage_root=/opt/odoo-accounting-cli-v3-home-gate
          test ! -e "$stage_root"
          sudo install -d -m 0755 -o root -g root "$stage_root"
          sudo cp -a "$GITHUB_WORKSPACE/." "$stage_root/"
          sudo chown -R root:root "$stage_root"
          sudo chmod -R u=rwX,go=rX "$stage_root"

          python_bin="$(command -v python)"
          historical_root=/var/lib/odoo-accounting-cli-v3
          historical_evidence="$historical_root/evidence"
          historical_sentinel="$historical_evidence/state-directory-sentinel"
          sudo install -d -m 0755 -o root -g root "$historical_root"
          sudo install -d -m 0755 -o root -g root "$historical_evidence"
          printf 'retained evidence\n' > "$RUNNER_TEMP/state-directory-sentinel"
          sudo install -m 0444 -o root -g root \
            "$RUNNER_TEMP/state-directory-sentinel" "$historical_sentinel"
          broker_home=/var/lib/odoo-accounting-cli-v3-broker
          report="$broker_home/non-root-linux-process-tree.xml"
          sudo systemd-run \
            --unit=odoo-accounting-cli-v3-home-gate \
            --service-type=exec \
            --wait \
            --collect \
            --pipe \
            --quiet \
            --property=User=odoo-v3-broker \
            --property=Group=odoo-v3-broker \
            --property=UMask=0077 \
            --property=NoNewPrivileges=yes \
            --property=PrivateTmp=yes \
            --property=ProtectHome=yes \
            --property=ProtectSystem=strict \
            --property=StateDirectory=odoo-accounting-cli-v3-broker \
            --property=StateDirectoryMode=0700 \
            --property=ReadWritePaths=/var/lib/odoo-accounting-cli-v3 \
            --working-directory="$stage_root" \
            --setenv=HOME=/var/lib/odoo-accounting-cli-v3-broker \
            --setenv=ODOO_CLI_V3_LINUX_GATE=1 \
            --setenv=PYTHONDONTWRITEBYTECODE=1 \
            --setenv=PYTHONPATH="$stage_root/src" \
            "$python_bin" -m pytest -q -p no:cacheprovider \
              --junitxml="$report" \
              tests/test_odoo_runner.py \
              tests/test_odoo_runner_linux.py

          test "$(sudo stat -c %U:%G "$broker_home")" = \
            odoo-v3-broker:odoo-v3-broker
          test "$(sudo stat -c %a "$broker_home")" = 700
          test "$(sudo stat -c %U:%G "$historical_root")" = root:root
          test "$(sudo stat -c %a "$historical_root")" = 755
          test "$(sudo stat -c %U:%G "$historical_evidence")" = root:root
          test "$(sudo stat -c %a "$historical_evidence")" = 755
          test "$(sudo stat -c %U:%G "$historical_sentinel")" = root:root
          test "$(sudo stat -c %a "$historical_sentinel")" = 444
          test "$(sudo cat "$historical_sentinel")" = "retained evidence"
          sudo REPORT="$report" "$python_bin" - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse(os.environ["REPORT"]).getroot()
          tests = root.findall(".//testcase")
          failures = root.findall(".//failure")
          errors = root.findall(".//error")
          skipped = root.findall(".//skipped")
          if not tests or failures or errors or skipped:
              raise SystemExit(
                  "non-root Linux process gate failed: "
                  f"tests={len(tests)} failures={len(failures)} "
                  f"errors={len(errors)} skipped={len(skipped)}"
              )
          print(f"non_root_linux_process_tests={len(tests)}")
          PY
      - name: Stress Linux UDS capacity and atomic session lifecycle
        run: |
          set -euo pipefail
          test "$(python -c 'import sys; print(sys.platform)')" = linux
          for attempt in $(seq 1 10); do
            report="$RUNNER_TEMP/linux-concurrency-$attempt.xml"
            python -m pytest -q --junitxml="$report" \
              tests/test_trusted_broker_uds.py::test_real_linux_slow_client_consumes_one_bounded_slot_then_releases_it \
              tests/test_trusted_session_sqlite.py::test_empty_store_initialization_is_atomic_across_processes \
              tests/test_trusted_session_sqlite.py::test_single_use_resolution_is_atomic_across_processes
          done
          RUNNER_TEMP="$RUNNER_TEMP" python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          reports = sorted(
              Path(os.environ["RUNNER_TEMP"]).glob("linux-concurrency-*.xml")
          )
          if len(reports) != 10:
              raise SystemExit(
                  f"Linux concurrency reports are incomplete: {len(reports)}"
              )
          for report in reports:
              root = ET.parse(report).getroot()
              tests = root.findall(".//testcase")
              failures = root.findall(".//failure")
              errors = root.findall(".//error")
              skipped = root.findall(".//skipped")
              if len(tests) != 3 or failures or errors or skipped:
                  raise SystemExit(
                      f"Linux concurrency gate failed for {report.name}: "
                      f"tests={len(tests)} failures={len(failures)} "
                      f"errors={len(errors)} skipped={len(skipped)}"
                  )
          print(f"linux_concurrency_repetitions={len(reports)}")
          PY
      - name: Gate reconciliation-only recovery without skips
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/reconciliation-only.xml"
          python -m pytest -q --junitxml="$report" \
            tests/test_trusted_authority.py::test_expired_inflight_approval_issues_reconciliation_only_authority \
            tests/test_trusted_authority.py::test_unexpired_inflight_retry_uses_safe_reconciliation_mode \
            tests/test_odoo_write_bootstrap.py::test_expired_execute_mode_without_anchor_is_rejected_without_claim_or_handler \
            tests/test_odoo_write_bootstrap.py::test_expired_reconciliation_without_anchor_is_unknown_and_never_claims \
            tests/test_odoo_write_bootstrap.py::test_unexpired_verifying_reconciliation_without_anchor_never_claims_or_executes \
            tests/test_odoo_write_bootstrap.py::test_reconciliation_mode_bit_flip_is_rejected_before_anchor_lookup \
            tests/test_odoo_write_bootstrap.py::test_expired_approval_replays_verified_anchor_without_new_write \
            tests/test_odoo_write_bootstrap.py::test_expired_reconciliation_finishes_committed_anchor_without_execute \
            tests/test_odoo_write_bootstrap.py::test_normal_verification_rolls_back_handler_side_effect_before_control_commit \
            tests/test_odoo_write_bootstrap.py::test_committed_reconciliation_rolls_back_verify_side_effect_before_control_commit \
            tests/test_odoo_write_bootstrap.py::test_expired_reconciliation_rejects_claimed_anchor_without_side_effect \
            tests/test_odoo_write_bootstrap.py::test_expired_reconciliation_replays_failed_anchor_without_handler_or_commit
          sudo "$(command -v python)" - "$report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          tests = root.findall(".//testcase")
          failures = root.findall(".//failure")
          errors = root.findall(".//error")
          skipped = root.findall(".//skipped")
          if not tests or failures or errors or skipped:
              raise SystemExit(
                  "reconciliation-only gate failed: "
                  f"tests={len(tests)} failures={len(failures)} "
                  f"errors={len(errors)} skipped={len(skipped)}"
              )
          print(f"reconciliation_only_tests={len(tests)}")
          PY
      - name: Exercise real Linux UDS and systemd activation contracts
        run: |
          set -euo pipefail
          test "$(python -c 'import sys; print(sys.platform)')" = linux
          python -m pytest -q \
            tests/test_systemd_activation.py \
            tests/test_trusted_broker_uds.py \
            tests/test_trusted_session_mint_uds.py \
            tests/test_trusted_approval_uds.py \
            tests/test_trusted_broker_main.py \
            tests/test_dev9_systemd_units.py
      - name: Exercise root-owned UDS binding and cleanup guards
        run: |
          set -euo pipefail
          python_bin="$(command -v python)"
          sudo env PYTHONPATH="$GITHUB_WORKSPACE/src" \
            "$python_bin" -m pytest -q \
            tests/test_trusted_broker_uds.py::test_root_launcher_binds_and_removes_only_its_real_linux_socket \
            tests/test_trusted_broker_uds.py::test_server_close_never_unlinks_a_replacement_socket \
            tests/test_trusted_broker_uds.py::test_root_launcher_rejects_a_symlinked_socket_parent \
            tests/test_trusted_approval_uds.py::test_real_linux_root_factory_secures_and_cleans_socket
      - name: Exercise the root-owned Odoo add-on release binding
        run: |
          set -euo pipefail
          python_bin="$(command -v python)"
          sudo env \
            PYTHONPATH="$GITHUB_WORKSPACE/src" \
            ODOO_RELEASE_BINDING_RUN_ROOT_INTEGRATION=1 \
            "$python_bin" -m pytest -q \
            tests/test_odoo_release_binding.py::test_root_owned_release_verifies_in_real_linux_process
      - name: Verify the shipped systemd unit graph
        run: |
          set -euo pipefail
          command -v systemd-analyze
          rendered_root="$RUNNER_TEMP/odoo-v3-systemd"
          release_name="ci-verified-release"
          broker_bin="/opt/odoo-accounting-cli-v3/releases/$release_name/bin/odoo-accounting-cli-v3-broker"
          finalizer_bin="/opt/odoo-accounting-cli-v3/releases/$release_name/bin/odoo-accounting-cli-v3-effect-finalizer"
          finalizer_gate="/opt/odoo-accounting-cli-v3/releases/$release_name/deployment/dev27/finalizer_runtime_gate.py"
          install -d -m 0755 "$rendered_root"
          RELEASE_NAME="$release_name" python - <<'PY'
          import os
          from pathlib import Path

          source = Path(os.environ["GITHUB_WORKSPACE"]) / "deployment/dev9/systemd"
          target = Path(os.environ["RUNNER_TEMP"]) / "odoo-v3-systemd"
          service = (source / "odoo-accounting-cli-v3-broker.service").read_text()
          assert service.count("@V3_RELEASE@") == 1
          (target / "odoo-accounting-cli-v3-broker.service").write_text(
              service.replace("@V3_RELEASE@", os.environ["RELEASE_NAME"])
          )
          for name in (
              "odoo-accounting-cli-v3-pi-broker.socket",
              "odoo-accounting-cli-v3-session-mint.socket",
              "odoo-accounting-cli-v3-trusted-approval.socket",
          ):
              (target / name).write_bytes((source / name).read_bytes())

          pi_source = Path(os.environ["GITHUB_WORKSPACE"]) / "deployment/dev11/systemd"
          pi_service = (pi_source / "odoo-accounting-cli-v3-pi-bridge.service").read_text()
          assert pi_service.count("@V3_RELEASE@") == 5
          assert pi_service.count("@V3_NODE@") == 1
          (target / "odoo-accounting-cli-v3-pi-bridge.service").write_text(
              pi_service.replace("@V3_RELEASE@", os.environ["RELEASE_NAME"]).replace(
                  "@V3_NODE@", "/usr/bin/node"
              )
          )
          (target / "odoo-accounting-cli-v3-pi-bridge.socket").write_bytes(
              (pi_source / "odoo-accounting-cli-v3-pi-bridge.socket").read_bytes()
          )

          finalizer_source = Path(os.environ["GITHUB_WORKSPACE"]) / "deployment/dev23/systemd"
          finalizer_service = (
              finalizer_source / "odoo-accounting-cli-v3-effect-finalizer.service"
          ).read_text()
          assert finalizer_service.count("@V3_RELEASE@") == 2
          assert finalizer_service.count(
              "@V3_FINALIZER_RUNTIME_MANIFEST_SHA256@"
          ) == 1
          (target / "odoo-accounting-cli-v3-effect-finalizer.service").write_text(
              finalizer_service.replace(
                  "@V3_RELEASE@", os.environ["RELEASE_NAME"]
              ).replace(
                  "@V3_FINALIZER_RUNTIME_MANIFEST_SHA256@", "f" * 64
              )
          )
          (target / "odoo-accounting-cli-v3-effect-finalizer.socket").write_bytes(
              (
                  finalizer_source
                  / "odoo-accounting-cli-v3-effect-finalizer.socket"
              ).read_bytes()
          )
          PY
          for group in \
            odoo-v3-broker \
            odoo-v3-runtime \
            odoo-v3-pi-broker \
            odoo-v3-odoo-control \
            odoo-v3-effect-finalizer; do
            if ! getent group "$group" >/dev/null; then
              sudo groupadd --system "$group"
            fi
          done
          if ! getent passwd odoo-v3-broker >/dev/null; then
            sudo useradd --system \
              --gid odoo-v3-broker \
              --groups odoo-v3-runtime \
              --home-dir /nonexistent \
              --shell /usr/sbin/nologin \
              odoo-v3-broker
          fi
          if ! getent passwd odoo-v3-pi-broker >/dev/null; then
            sudo useradd --system \
              --gid odoo-v3-pi-broker \
              --groups odoo-v3-runtime \
              --home-dir /nonexistent \
              --shell /usr/sbin/nologin \
              odoo-v3-pi-broker
          fi
          if ! getent passwd odoo-v3-effect-finalizer >/dev/null; then
            sudo useradd --system \
              --gid odoo-v3-effect-finalizer \
              --groups odoo-v3-runtime \
              --home-dir /nonexistent \
              --shell /usr/sbin/nologin \
              odoo-v3-effect-finalizer
          fi
          sudo install -d -m 0755 "$(dirname "$broker_bin")"
          sudo install -m 0755 /bin/true "$broker_bin"
          sudo install -m 0755 /bin/true "$finalizer_bin"
          sudo install -d -m 0755 "$(dirname "$finalizer_gate")"
          sudo install -m 0444 \
            "$GITHUB_WORKSPACE/deployment/dev27/finalizer_runtime_gate.py" \
            "$finalizer_gate"
          if [ ! -x /usr/bin/node ]; then
            sudo install -m 0755 /bin/true /usr/bin/node
          fi
          sudo install -d -m 0755 \
            "/opt/odoo-accounting-cli-v3/pi-runtime/$release_name/pi_bridge"
          systemd-analyze \
            --recursive-errors=yes \
            --man=no \
            verify \
            "$rendered_root/odoo-accounting-cli-v3-broker.service" \
            "$rendered_root/odoo-accounting-cli-v3-pi-broker.socket" \
            "$rendered_root/odoo-accounting-cli-v3-session-mint.socket" \
            "$rendered_root/odoo-accounting-cli-v3-trusted-approval.socket" \
            "$rendered_root/odoo-accounting-cli-v3-effect-finalizer.service" \
            "$rendered_root/odoo-accounting-cli-v3-effect-finalizer.socket" \
            "$rendered_root/odoo-accounting-cli-v3-pi-bridge.service" \
            "$rendered_root/odoo-accounting-cli-v3-pi-bridge.socket"

  dev27-finalizer-runtime:
    name: Dev27 isolated finalizer runtime gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install the root-managed PostgreSQL driver
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes python3-psycopg2
          /usr/bin/python3 -I -B -X utf8 - <<'PY'
          import importlib.util
          import psycopg2
          import sys

          assert sys.flags.isolated
          assert importlib.util.find_spec("odoo") is None
          assert psycopg2.__version__
          print(f"system_python={sys.version.split()[0]}")
          print(f"psycopg2={psycopg2.__version__}")
          PY
          dpkg-query -W -f='python3-psycopg2=${Version}\nlibpq5=${Version}\n' \
            python3-psycopg2 libpq5
      - name: Collect twice and verify as the non-root service boundary
        shell: bash
        run: |
          set -euo pipefail
          release_name=ci-dev27-finalizer-runtime
          release_root="/opt/odoo-accounting-cli-v3/releases/$release_name"
          gate="$release_root/deployment/dev27/finalizer_runtime_gate.py"
          config_root=/etc/odoo-accounting-cli-v3
          manifest="$config_root/effect-finalizer-runtime-manifest.json"
          first="$RUNNER_TEMP/finalizer-runtime-1.json"
          second="$RUNNER_TEMP/finalizer-runtime-2.json"

          # GitHub's hosted Ubuntu image deliberately makes /opt world-writable.
          # Normalize the production release ancestor in this disposable runner so
          # the gate is tested against the same root-owned boundary required on host.
          sudo chown root:root /opt
          sudo chmod 0755 /opt
          sudo install -d -m 0755 -o root -g root \
            /opt/odoo-accounting-cli-v3 \
            /opt/odoo-accounting-cli-v3/releases \
            "$release_root" \
            "$release_root/src"
          sudo cp -a "$GITHUB_WORKSPACE/src/." "$release_root/src/"
          test -z "$(sudo find "$release_root/src" -type l -print -quit)"
          sudo find "$release_root/src" -exec chown root:root {} +
          sudo find "$release_root/src" -type d -exec chmod 0755 {} +
          sudo find "$release_root/src" -type f -exec chmod 0444 {} +
          sudo install -d -m 0755 -o root -g root "$(dirname "$gate")"
          sudo install -m 0444 -o root -g root \
            "$GITHUB_WORKSPACE/deployment/dev27/finalizer_runtime_gate.py" \
            "$gate"
          collect_runtime() {
            local output=$1
            if sudo /usr/bin/python3 -I -B -X utf8 "$gate" collect \
              --interpreter /usr/bin/python3 > "$output"
            then
              return 0
            fi
            sudo /usr/bin/python3 -I -B -X utf8 - "$gate" <<'PY'
          import importlib.util
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          gate_path = Path(sys.argv[1]).resolve(strict=True)
          spec = importlib.util.spec_from_file_location(
              "dev27_finalizer_runtime_gate_diagnostic", gate_path
          )
          assert spec is not None and spec.loader is not None
          gate_module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = gate_module
          spec.loader.exec_module(gate_module)
          source_root = gate_module._finalizer_source_root()
          probe = subprocess.run(
              [
                  "/usr/bin/python3",
                  "-I",
                  "-B",
                  "-X",
                  "utf8",
                  "-c",
                  gate_module._PROBE_CODE,
                  str(source_root),
              ],
              cwd="/",
              env={"LD_BIND_NOW": "1"},
              stdin=subprocess.DEVNULL,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              timeout=15,
              check=False,
              close_fds=True,
          )
          diagnostic = {
              "probe_returncode": probe.returncode,
              "probe_stderr": probe.stderr[:2048].decode(
                  "utf-8", errors="backslashreplace"
              ),
              "probe_stdout_bytes": len(probe.stdout),
          }
          if probe.returncode == 0 and not probe.stderr and probe.stdout:
              payload = json.loads(probe.stdout.decode("utf-8"))
              path_failures = []

              def check_path(label, value, checker):
                  text = os.fspath(value)
                  try:
                      checker(text, require_root_owner=True)
                  except BaseException as error:
                      path_failures.append(
                          {
                              "label": label,
                              "path": text,
                              "type": type(error).__name__,
                              "message": str(error)[:1024],
                          }
                      )

              check_path(
                  "interpreter", payload["executable"], gate_module._file_record
              )
              check_path(
                  "source_root", source_root, gate_module._directory_record
              )
              check_path(
                  "finalizer_module_file",
                  payload["finalizer_module_file"],
                  gate_module._file_record,
              )
              for field in (
                  "python_module_files",
                  "psycopg2_files",
                  "sys_path_files",
                  "pth_files",
                  "mapped_files",
              ):
                  for value in payload[field]:
                      check_path(field, value, gate_module._file_record)
              for value in payload["sys_path_directories"]:
                  check_path(
                      "sys_path_directories",
                      value,
                      gate_module._directory_record,
                  )
              for value in payload["sys_path_missing"]:
                  check_path(
                      "sys_path_missing",
                      value,
                      gate_module._missing_path_record,
                  )
              diagnostic["path_failures"] = path_failures[:32]
          try:
              gate_module.collect_manifest("/usr/bin/python3")
          except BaseException as error:
              chain = []
              observed = error
              while observed is not None and len(chain) < 8:
                  chain.append(
                      {
                          "type": type(observed).__name__,
                          "message": str(observed)[:1024],
                      }
                  )
                  observed = observed.__cause__ or observed.__context__
              diagnostic["collect_error_chain"] = chain
          else:
              diagnostic["collect_error_chain"] = [
                  {"type": "unexpected_success", "message": ""}
              ]
          print(
              json.dumps(
                  diagnostic,
                  ensure_ascii=True,
                  allow_nan=False,
                  sort_keys=True,
                  separators=(",", ":"),
              ),
              file=sys.stderr,
          )
          PY
            return 1
          }
          collect_runtime "$first"
          collect_runtime "$second"
          cmp "$first" "$second"

          sudo install -d -m 0755 -o root -g root "$config_root"
          sudo install -m 0444 -o root -g root "$first" "$manifest"
          manifest_sha256="$(sha256sum "$first" | cut -d' ' -f1)"
          sudo -u nobody /usr/bin/python3 -I -B -X utf8 "$gate" verify \
            --interpreter /usr/bin/python3 \
            --manifest "$manifest" \
            --expected-manifest-sha256 "$manifest_sha256" > /dev/null
          sha256sum "$first"

          service_uid="$(id -u nobody)"
          service_gid="$(id -g nobody)"
          broker_uid="$(id -u daemon)"
          socket_gid="$(id -g daemon)"
          test "$service_uid" != "$broker_uid"
          test "$service_gid" != "$socket_gid"
          journal_root=/var/lib/odoo-accounting-cli-v3-effect-finalizer-ci
          pgpass="$config_root/effect-finalizer-ci.pgpass"
          hmac="$config_root/effect-finalizer-ci.hmac"
          runtime_config="$config_root/effect-finalizer-runtime.json"
          printf '%s\n' \
            '/var/run/postgresql:5432:odoo_sandbox:odoo_v3_finalizer:ci-password' \
            > "$RUNNER_TEMP/effect-finalizer-ci.pgpass"
          printf '%s' \
            'ci-effect-finalizer-hmac-secret-at-least-32-bytes' \
            > "$RUNNER_TEMP/effect-finalizer-ci.hmac"
          sudo install -m 0400 -o "$service_uid" -g "$service_gid" \
            "$RUNNER_TEMP/effect-finalizer-ci.pgpass" "$pgpass"
          sudo install -m 0400 -o "$service_uid" -g "$service_gid" \
            "$RUNNER_TEMP/effect-finalizer-ci.hmac" "$hmac"
          sudo install -d -m 0700 -o "$service_uid" -g "$service_gid" \
            "$journal_root"
          SERVICE_UID="$service_uid" \
          SERVICE_GID="$service_gid" \
          BROKER_UID="$broker_uid" \
          SOCKET_GID="$socket_gid" \
          MANIFEST_PATH="$manifest" \
          MANIFEST_SHA256="$manifest_sha256" \
          PGPASS_PATH="$pgpass" \
          HMAC_PATH="$hmac" \
          JOURNAL_PATH="$journal_root/attempts.sqlite3" \
          /usr/bin/python3 -I -B -X utf8 - \
            > "$RUNNER_TEMP/effect-finalizer-runtime.json" <<'PY'
          import json
          import os

          document = {
              "schema_version": 2,
              "service_uid": int(os.environ["SERVICE_UID"]),
              "service_gid": int(os.environ["SERVICE_GID"]),
              "database_name": "odoo_sandbox",
              "database_uuid": "11111111-1111-4111-8111-111111111111",
              "database_user": "odoo_v3_finalizer",
              "database_host": "/var/run/postgresql",
              "database_port": 5432,
              "database_connect_timeout_seconds": 2,
              "dependency_manifest_path": os.environ["MANIFEST_PATH"],
              "dependency_manifest_sha256": os.environ["MANIFEST_SHA256"],
              "pgpass_path": os.environ["PGPASS_PATH"],
              "attestation_key_id": "effect-finalizer-ci-v1",
              "expected_guard_installation_id": (
                  "22222222-2222-4222-8222-222222222222"
              ),
              "expected_database_oid": 16384,
              "attestation_secret_path": os.environ["HMAC_PATH"],
              "journal_path": os.environ["JOURNAL_PATH"],
              "proof_ttl_seconds": 120,
              "statement_timeout_ms": 500,
              "uds": {
                  "socket_path": "/run/odoo-accounting-cli-v3/effect-finalizer.sock",
                  "socket_owner_uid": 0,
                  "socket_group_gid": int(os.environ["SOCKET_GID"]),
                  "socket_mode": 432,
                  "broker_service_uid": int(os.environ["BROKER_UID"]),
                  "broker_systemd_unit": (
                      "odoo-accounting-cli-v3-broker.service"
                  ),
                  "finalizer_systemd_unit": (
                      "odoo-accounting-cli-v3-effect-finalizer.service"
                  ),
                  "handoff_idle_timeout_seconds": 115,
                  "request_io_timeout_seconds": 10,
                  "max_request_bytes": 16384,
                  "max_response_bytes": 32768,
                  "max_inflight_requests": 4,
              },
          }
          print(json.dumps(document, sort_keys=True, separators=(",", ":")))
          PY
          sudo install -m 0444 -o root -g root \
            "$RUNNER_TEMP/effect-finalizer-runtime.json" "$runtime_config"
          sudo -u nobody env -i LD_BIND_NOW=1 \
            /usr/bin/python3 -I -B -X utf8 - \
            "$release_root/src" "$runtime_config" <<'PY'
          import sys
          from pathlib import Path

          source_root = Path(sys.argv[1]).resolve(strict=True)
          sys.path.insert(0, str(source_root))
          from odoo_accounting_cli_v3.effect_finalizer_main import (
              build_effect_finalizer_application,
          )

          application = build_effect_finalizer_application(sys.argv[2])
          assert application.config.dependency_manifest_path == Path(
              "/etc/odoo-accounting-cli-v3/effect-finalizer-runtime-manifest.json"
          )
          assert application.config.require_posix_owner is True
          print("finalizer_in_process_preflight=ok")
          PY

          tampered_source="$RUNNER_TEMP/finalizer-runtime-tampered.json"
          tampered_manifest="$config_root/effect-finalizer-runtime-tampered.json"
          /usr/bin/python3 -I -B -X utf8 - "$first" "$tampered_source" <<'PY'
          import json
          import sys
          from pathlib import Path

          source = Path(sys.argv[1])
          target = Path(sys.argv[2])
          document = json.loads(source.read_text("utf-8"))
          document["runtime"]["psycopg2_version"] += "-tampered"
          target.write_text(
              json.dumps(
                  document,
                  ensure_ascii=True,
                  allow_nan=False,
                  sort_keys=True,
                  separators=(",", ":"),
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          sudo install -m 0444 -o root -g root \
            "$tampered_source" "$tampered_manifest"
          set +e
          sudo -u nobody /usr/bin/python3 -I -B -X utf8 "$gate" verify \
            --interpreter /usr/bin/python3 \
            --manifest "$tampered_manifest" \
            --expected-manifest-sha256 "$manifest_sha256" \
            > "$RUNNER_TEMP/tampered.stdout" \
            2> "$RUNNER_TEMP/tampered.stderr"
          status=$?
          set -e
          test "$status" -eq 1
          test ! -s "$RUNNER_TEMP/tampered.stdout"
          grep -Fxq 'finalizer runtime dependency gate failed closed' \
            "$RUNNER_TEMP/tampered.stderr"

  pi-bridge:
    name: Pi trusted broker contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: pi_bridge/package-lock.json
      - name: Install the locked Pi runtime without package scripts
        working-directory: pi_bridge
        run: npm ci --ignore-scripts
      - name: Verify Pi bridge syntax and security contracts
        working-directory: pi_bridge
        run: |
          node --check bootstrap.mjs
          node --check create-runtime-binding.mjs
          node --check release-binding.mjs
          node --check server.mjs
          node --check tool-policy.mjs
          node --check trusted-session.mjs
          node --check odoo-session-header-resolver.mjs
          node --check extensions/odoo-v3-cli.mjs
          PI_BRIDGE_RUN_ROOT_INTEGRATION=1 npm test
      - name: Verify the locked Pi CLI treats caller text literally
        working-directory: pi_bridge
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { parseArgs } from "./node_modules/@earendil-works/pi-coding-agent/dist/cli/args.js";
          import { literalPiUserPrompt } from "./tool-policy.mjs";

          const contextPath = "/var/lib/odoo-accounting-cli-v3-pi-bridge/sessions/contexts/fixed.md";
          const prompt = literalPiUserPrompt("@/etc/passwd");
          const parsed = parseArgs([
            "--print",
            "--no-builtin-tools",
            "--no-context-files",
            "--no-extensions",
            "--extension", "/canonical/odoo-tools.ts",
            "--tools", "odoo_v3_capability_list",
            "--session-dir", "/state",
            "--session-id", "--tools",
            "--provider", "@/etc/passwd",
            "--model", "--extension",
            "--system-prompt", "@/etc/shadow",
            `@${contextPath}`,
            prompt,
          ]);
          assert.deepEqual(parsed.extensions, ["/canonical/odoo-tools.ts"]);
          assert.deepEqual(parsed.tools, ["odoo_v3_capability_list"]);
          assert.deepEqual(parsed.fileArgs, [contextPath]);
          assert.deepEqual(parsed.messages, [prompt]);
          assert.equal(parsed.sessionId, "--tools");
          assert.equal(parsed.provider, "@/etc/passwd");
          assert.equal(parsed.model, "--extension");
          assert.equal(parsed.systemPrompt, "@/etc/shadow");
          JS

  deployment-toolchain:
    name: dev8 + dev15 + dev18 + dev19 deployment toolchains
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: Verify the tracked dev8 tool manifest and embedded Python
        run: python deployment/dev8/check_toolchain.py
      - name: Verify the exact dev15 toolchain manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest=deployment/dev15/TOOLCHAIN-MANIFEST.json
          manifest_sha256="$(sha256sum "$manifest" | cut -d ' ' -f 1)"
          test "${#manifest_sha256}" -eq 64
          python deployment/dev15/check_toolchain.py "$manifest_sha256"
      - name: Verify the Dev18 sandbox capacity gate
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/dev18-capacity-gate.xml"
          python -m pytest -q --junitxml="$report" \
            tests/test_dev18_sandbox_capacity_gate.py \
            tests/test_dev18_protected_resource_closure.py \
            tests/test_dev18_pg_config_socket_closure.py \
            tests/test_dev18_attested_psql_runner.py
          python - "$report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          tests = root.findall(".//testcase")
          skipped = root.findall(".//skipped")
          failures = root.findall(".//failure")
          errors = root.findall(".//error")
          if len(tests) != 167 or skipped or failures or errors:
              raise SystemExit(
                  "Dev18 capacity gate did not execute exactly 167 tests: "
                  f"tests={len(tests)} skipped={len(skipped)} "
                  f"failures={len(failures)} errors={len(errors)}"
              )
          print("dev18_capacity_gate_tests=167")
          PY
      - name: Verify the Dev19 fail-closed isolation contracts on Linux
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/dev19-isolation-contracts.xml"
          python -m pytest -q --junitxml="$report" \
            tests/test_dev19_sandbox_isolation_gate.py \
            tests/test_dev19_sandbox_namespace_probe.py \
            -k 'not real_linux_root_captures_the_full_initial_host_context'
          python - "$report" 296 <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          expected = int(sys.argv[2])
          tests = root.findall(".//testcase")
          failures = root.findall(".//failure")
          errors = root.findall(".//error")
          skipped = root.findall(".//skipped")
          if len(tests) != expected or failures or errors or skipped:
              raise SystemExit(
                  "Dev19 Linux contract gate failed: "
                  f"tests={len(tests)} expected={expected} "
                  f"failures={len(failures)} errors={len(errors)} "
                  f"skipped={len(skipped)}"
              )
          print(f"dev19_linux_contract_tests={len(tests)}")
          PY
      - name: Exercise the Dev19 initial-host context as Linux root
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/dev19-root-host-context.xml"
          sudo env \
            DEV19_ROOT_HOST_CONTEXT_INTEGRATION=1 \
            "$(command -v python)" -m pytest -q -p no:cacheprovider \
              --junitxml="$report" \
              tests/test_dev19_sandbox_isolation_gate.py::test_real_linux_root_captures_the_full_initial_host_context
          sudo "$(command -v python)" - "$report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          tests = root.findall(".//testcase")
          failures = root.findall(".//failure")
          errors = root.findall(".//error")
          skipped = root.findall(".//skipped")
          if len(tests) != 1 or failures or errors or skipped:
              raise SystemExit(
                  "Dev19 root host-context gate failed: "
                  f"tests={len(tests)} failures={len(failures)} "
                  f"errors={len(errors)} skipped={len(skipped)}"
              )
          print("dev19_root_host_context_tests=1")
          PY
      - name: Exercise the dev15 immutable installer as Linux root
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/dev15-root-installer.xml"
          sudo "$(command -v python)" -m pytest -q \
            --junitxml="$report" \
            "tests/test_dev15_toolchain_installer.py::test_full_production_install_is_immutable_and_idempotent"
          sudo "$(command -v python)" - "$report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          tests = root.findall(".//testcase")
          skipped = root.findall(".//skipped")
          failures = root.findall(".//failure")
          errors = root.findall(".//error")
          if len(tests) != 1 or skipped or failures or errors:
              raise SystemExit(
                  "dev15 root installer gate did not execute exactly once: "
                  f"tests={len(tests)}, skipped={len(skipped)}, "
                  f"failures={len(failures)}, errors={len(errors)}"
              )
          print("dev15_root_installer_tests=1")
          PY
      - name: Verify shell syntax
        shell: bash
        run: |
          set -euo pipefail
          for path in deployment/dev8/*.sh; do
            bash -n "$path"
          done

  dev18-postgresql-integration:
    name: Dev18 + Dev28 real PostgreSQL gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the test runtime
        run: python -m pip install -e ".[test]" "psycopg2-binary==2.9.9"
      - name: Start an isolated CI PostgreSQL authority
        id: postgres
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes postgresql postgresql-client
          fi
          sudo service postgresql start
          ready=false
          for _attempt in $(seq 1 30); do
            if sudo -u postgres psql -X -q -A -t -w \
              -v ON_ERROR_STOP=1 -d postgres -c 'SELECT 1' \
              >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          server_version_num="$(
            sudo -u postgres psql -X -q -A -t -w -v ON_ERROR_STOP=1 \
              -d postgres -c 'SHOW server_version_num'
          )"
          test "$server_version_num" -ge 160000
          test "$server_version_num" -lt 170000
          if ! getent passwd odoo_probe >/dev/null; then
            sudo useradd --system --user-group --create-home \
              --shell /bin/bash odoo_probe
          fi
          sudo -u postgres psql -X -q -w -v ON_ERROR_STOP=1 \
            -d postgres <<'SQL'
          CREATE ROLE odoo_probe
            LOGIN NOSUPERUSER NOCREATEROLE CREATEDB NOINHERIT NOREPLICATION
            NOBYPASSRLS;
          CREATE ROLE odoo_probe_other
            LOGIN NOSUPERUSER NOCREATEROLE CREATEDB NOINHERIT
            NOREPLICATION NOBYPASSRLS;
          SQL
          psql_path="$(command -v psql)"
          runuser_path="$(command -v runuser)"
          socket_setting="$(
            sudo -u postgres psql -X -q -A -t -w -v ON_ERROR_STOP=1 \
              -d postgres -c 'SHOW unix_socket_directories'
          )"
          socket_directory="${socket_setting%%,*}"
          socket_directory="${socket_directory//[[:space:]]/}"
          port="$(
            sudo -u postgres psql -X -q -A -t -w -v ON_ERROR_STOP=1 \
              -d postgres -c 'SHOW port'
          )"
          test -S "$socket_directory/.s.PGSQL.$port"
          sudo -u odoo_probe "$psql_path" -X -q -A -t -w \
            -v ON_ERROR_STOP=1 -h "$socket_directory" -p "$port" \
            -U odoo_probe -d postgres \
            -c 'SELECT SESSION_USER = CURRENT_USER' | grep -qx t
          {
            printf 'psql_path=%s\n' "$psql_path"
            printf 'runuser_path=%s\n' "$runuser_path"
            printf 'socket_directory=%s\n' "$socket_directory"
            printf 'port=%s\n' "$port"
          } >> "$GITHUB_OUTPUT"
      - name: Prove the Odoo read boundary against real PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          python_path="$(command -v python)"
          stage_root="/var/lib/odoo-accounting-cli-v3-read-transaction-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo install -d -m 0755 -o root -g root \
            "$stage_root/src/odoo_accounting_cli_v3/odoo" \
            "$stage_root/tests"
          gate_files=(
            VERSION
            pyproject.toml
            src/odoo_accounting_cli_v3/__init__.py
            src/odoo_accounting_cli_v3/odoo/__init__.py
            src/odoo_accounting_cli_v3/odoo/read_transaction.py
            tests/test_odoo_read_transaction_postgres.py
          )
          for path in "${gate_files[@]}"; do
            sudo install -m 0444 -o root -g root "$path" "$stage_root/$path"
            cmp -s "$path" "$stage_root/$path"
            test "$(sudo stat -c '%U:%G:%a' "$stage_root/$path")" = \
              root:root:444
          done
          test "$(sudo stat -c '%U:%G:%a' "$stage_root")" = root:root:755
          report="$stage_root/read-transaction-postgresql.xml"
          sudo install -m 0600 -o odoo_probe -g odoo_probe /dev/null "$report"
          probe_environment=(
            HOME=/home/odoo_probe
            LANG=C.UTF-8
            LC_ALL=C.UTF-8
            PATH=/usr/sbin:/usr/bin:/sbin:/bin
            "PYTHONPATH=$stage_root/src"
            PYTHONDONTWRITEBYTECODE=1
            READ_TRANSACTION_POSTGRES_INTEGRATION=1
            "READ_TRANSACTION_PGHOST=${{ steps.postgres.outputs.socket_directory }}"
            "READ_TRANSACTION_PGPORT=${{ steps.postgres.outputs.port }}"
            READ_TRANSACTION_PGUSER=odoo_probe
          )
          sudo -u odoo_probe env -i \
            "${probe_environment[@]}" \
            /bin/bash -c 'cd "$1"; shift; exec "$@"' \
            _ "$stage_root" "$python_path" - "$stage_root" <<'PY'
          import sys
          from pathlib import Path

          from odoo_accounting_cli_v3.odoo import read_transaction

          root = Path(sys.argv[1]).resolve(strict=True)
          observed = Path(read_transaction.__file__).resolve(strict=True)
          expected = root / "src/odoo_accounting_cli_v3/odoo/read_transaction.py"
          assert Path.cwd() == root, Path.cwd()
          assert observed == expected, (observed, expected)
          print(f"read_transaction_module={observed}")
          PY
          sudo -u odoo_probe env -i \
            "${probe_environment[@]}" \
            /bin/bash -c 'cd "$1"; shift; exec "$@"' \
            _ "$stage_root" "$python_path" -m pytest -q -p no:cacheprovider \
              -c "$stage_root/pyproject.toml" \
              --rootdir="$stage_root" \
              --junitxml="$report" \
              "$stage_root/tests/test_odoo_read_transaction_postgres.py"
          sudo "$python_path" - "$report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          tests = root.findall(".//testcase")
          failures = root.findall(".//failure")
          errors = root.findall(".//error")
          skipped = root.findall(".//skipped")
          if len(tests) != 5 or failures or errors or skipped:
              raise SystemExit(
                  "read transaction PostgreSQL gate did not execute exactly five tests: "
                  f"tests={len(tests)} failures={len(failures)} "
                  f"errors={len(errors)} skipped={len(skipped)}"
              )
          print("read_transaction_real_postgresql_tests=5")
          PY
      - name: Execute the Dev18 SQL and configuration gates against real PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/dev18-postgresql-integration.xml"
          sudo env \
            DEV18_POSTGRES_INTEGRATION=1 \
            DEV18_PG_PSQL='${{ steps.postgres.outputs.psql_path }}' \
            DEV18_PG_RUNUSER='${{ steps.postgres.outputs.runuser_path }}' \
            DEV18_PG_SOCKET_DIRECTORY='${{ steps.postgres.outputs.socket_directory }}' \
            DEV18_PG_PORT='${{ steps.postgres.outputs.port }}' \
            DEV18_PG_ADMIN_OS_USER=postgres \
            DEV18_PG_ADMIN_DATABASE_USER=postgres \
            DEV18_PG_PROBE_OS_USER=odoo_probe \
            DEV18_PG_PROBE_DATABASE_USER=odoo_probe \
            DEV18_PG_OTHER_DATABASE_USER=odoo_probe_other \
            PYTHONDONTWRITEBYTECODE=1 \
            "$(command -v python)" -m pytest -q -p no:cacheprovider \
              --junitxml="$report" tests/test_dev18_postgres_integration.py
          sudo "$(command -v python)" - "$report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          tests = root.findall(".//testcase")
          failures = root.findall(".//failure")
          errors = root.findall(".//error")
          skipped = root.findall(".//skipped")
          if len(tests) != 13 or failures or errors or skipped:
              raise SystemExit(
                  "Dev18 PostgreSQL gate did not execute exactly thirteen tests: "
                  f"tests={len(tests)} failures={len(failures)} "
                  f"errors={len(errors)} skipped={len(skipped)}"
              )
          print("dev18_real_postgresql_tests=13")
          PY

  dev22-module-guard-postgresql:
    name: Dev22 real PostgreSQL module guard gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the test runtime
        run: python -m pip install -e ".[test]"
      - name: Start a fresh PostgreSQL 16 authority
        id: postgres
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes postgresql postgresql-client
          fi
          sudo service postgresql start
          ready=false
          for _attempt in $(seq 1 30); do
            if sudo -u postgres psql -X -q -A -t -w \
              -v ON_ERROR_STOP=1 -d postgres -c 'SELECT 1' \
              >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          server_version_num="$(
            sudo -u postgres psql -X -q -A -t -w -v ON_ERROR_STOP=1 \
              -d postgres -c 'SHOW server_version_num'
          )"
          test "$server_version_num" -ge 160000
          test "$server_version_num" -lt 170000
          psql_path="$(command -v psql)"
          runuser_path="$(command -v runuser)"
          stdbuf_path="$(command -v stdbuf)"
          socket_setting="$(
            sudo -u postgres psql -X -q -A -t -w -v ON_ERROR_STOP=1 \
              -d postgres -c 'SHOW unix_socket_directories'
          )"
          socket_directory="${socket_setting%%,*}"
          socket_directory="${socket_directory//[[:space:]]/}"
          port="$(
            sudo -u postgres psql -X -q -A -t -w -v ON_ERROR_STOP=1 \
              -d postgres -c 'SHOW port'
          )"
          test -S "$socket_directory/.s.PGSQL.$port"
          {
            printf 'psql_path=%s\n' "$psql_path"
            printf 'runuser_path=%s\n' "$runuser_path"
            printf 'stdbuf_path=%s\n' "$stdbuf_path"
            printf 'socket_directory=%s\n' "$socket_directory"
            printf 'port=%s\n' "$port"
          } >> "$GITHUB_OUTPUT"
      - name: Prove bootstrap rollback, ACLs, locks, epoch and crash quarantine
        id: dev22_postgres_tests
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/dev22-module-guard-postgresql.xml"
          sudo env \
            DEV22_MODULE_GUARD_POSTGRES=1 \
            DEV22_PG_PSQL='${{ steps.postgres.outputs.psql_path }}' \
            DEV22_PG_RUNUSER='${{ steps.postgres.outputs.runuser_path }}' \
            DEV22_PG_STDBUF='${{ steps.postgres.outputs.stdbuf_path }}' \
            DEV22_PG_SOCKET_DIRECTORY='${{ steps.postgres.outputs.socket_directory }}' \
            DEV22_PG_PORT='${{ steps.postgres.outputs.port }}' \
            DEV22_PG_ADMIN_OS_USER=postgres \
            DEV22_PG_ADMIN_DATABASE_USER=postgres \
            PYTHONDONTWRITEBYTECODE=1 \
            "$(command -v python)" -m pytest -q -p no:cacheprovider \
              --junitxml="$report" tests/test_dev22_module_guard_postgres.py
          sudo "$(command -v python)" - "$report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          tests = root.findall(".//testcase")
          failures = root.findall(".//failure")
          errors = root.findall(".//error")
          skipped = root.findall(".//skipped")
          if len(tests) != 4 or failures or errors or skipped:
              raise SystemExit(
                  "Dev22 PostgreSQL gate did not execute exactly four tests: "
                  f"tests={len(tests)} failures={len(failures)} "
                  f"errors={len(errors)} skipped={len(skipped)}"
              )
          print("dev22_real_postgresql_tests=4")
          PY
      - name: Publish exact Dev22 PostgreSQL failures as check annotations
        if: ${{ failure() && steps.dev22_postgres_tests.outcome == 'failure' }}
        shell: bash
        run: |
          sudo "$(command -v python)" - "$RUNNER_TEMP/dev22-module-guard-postgresql.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()

          def escape(value: str, *, property_value: bool = False) -> str:
              value = value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              if property_value:
                  value = value.replace(":", "%3A").replace(",", "%2C")
              return value

          failures = 0
          for case in root.iter("testcase"):
              problem = case.find("failure")
              if problem is None:
                  problem = case.find("error")
              if problem is None:
                  continue
              failures += 1
              path = case.get("file") or "tests/test_dev22_module_guard_postgres.py"
              line = int(case.get("line") or "0") + 1
              title = f"Dev22 PostgreSQL: {case.get('name', '')}"
              detail = problem.get("message") or problem.text or problem.tag
              print(
                  f"::error file={escape(path, property_value=True)},"
                  f"line={line},title={escape(title, property_value=True)}::"
                  f"{escape(detail)}"
              )
          if failures == 0:
              raise SystemExit("Dev22 PostgreSQL failed without a failure/error testcase")
          PY

  wheel-smoke:
    name: wheel -> fresh venv -> outside-source CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and stage runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/odoo-accounting-cli-v3-wheel-smoke"
          built="$smoke_root/built"
          wheelhouse="$smoke_root/wheelhouse"
          mkdir -p "$built" "$wheelhouse"
          expected_version="$(tr -d '\r\n' < VERSION)"
          test -n "$expected_version"
          export EXPECTED_VERSION="$expected_version"
          echo "EXPECTED_VERSION=$expected_version" >> "$GITHUB_ENV"

          python -m pip install "build>=1.2,<2"
          python -m build --wheel --outdir "$built" .

          mapfile -t wheels < <(
            find "$built" -maxdepth 1 -type f \
              -name 'odoo_accounting_cli_v3-*.whl' -print
          )
          test "${#wheels[@]}" -eq 1
          test "${wheels[0]##*/}" = \
            "odoo_accounting_cli_v3-${EXPECTED_VERSION}-py3-none-any.whl"
          python -m pip download \
            --only-binary=:all: \
            --dest "$wheelhouse" \
            "${wheels[0]}"
      - name: Install offline and smoke the installed CLI outside source
        shell: bash
        env:
          PYTHONPATH: ""
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/odoo-accounting-cli-v3-wheel-smoke"
          wheelhouse="$smoke_root/wheelhouse"
          venv="$smoke_root/runtime-venv"
          outside="$smoke_root/outside-source"
          python -m venv "$venv"

          runtime_python="$venv/bin/python"
          runtime_cli="$venv/bin/odoo-accounting-cli-v3"
          runtime_broker="$venv/bin/odoo-accounting-cli-v3-broker"
          PIP_NO_INDEX=1 "$runtime_python" -m pip install \
            --find-links "$wheelhouse" \
            odoo-accounting-cli-v3
          "$runtime_python" -m pip check

          mkdir -p "$outside"
          cd "$outside"
          test ! -e src
          test ! -e VERSION
          export PATH="$venv/bin:$PATH"
          hash -r
          test "$runtime_cli" = "$(command -v odoo-accounting-cli-v3)"
          test "$runtime_broker" = "$(command -v odoo-accounting-cli-v3-broker)"

          SOURCE_ROOT="$GITHUB_WORKSPACE" "$runtime_python" -I - <<'PY'
          import os
          import pkgutil
          import sys
          from importlib import import_module, metadata, resources
          from pathlib import Path
          from tempfile import TemporaryDirectory

          import odoo_accounting_cli_v3 as package
          from odoo_accounting_cli_v3 import (
              broker_audit,
              historical_router,
              odoo_approver_authorizer,
              systemd_activation,
              trusted_approval_uds,
              trusted_authority,
              trusted_authority_bootstrap,
              trusted_authority_sqlite,
              trusted_broker,
              trusted_broker_app,
              trusted_broker_main,
              trusted_broker_uds,
              trusted_idempotency,
              trusted_read,
              trusted_response_verifier,
              trusted_session_mint_uds,
              trusted_session_sqlite,
              verified_release,
              write_api,
              write_app,
              write_protocol,
              write_receipts,
              write_runtime,
              write_service,
          )
          from odoo_accounting_cli_v3.domain import write_semantics
          from odoo_accounting_cli_v3.odoo import (
              write_bootstrap,
              write_handlers,
              write_precheck,
              write_runner,
          )
          from odoo_accounting_cli_v3.persistence import (
              SCHEMA_VERSION,
              SQLitePersistence,
          )

          module_file = Path(package.__file__).resolve()
          source_root = Path(os.environ["SOURCE_ROOT"]).resolve()
          venv_root = Path(sys.prefix).resolve()
          assert not module_file.is_relative_to(source_root), module_file
          assert module_file.is_relative_to(venv_root), module_file
          installed_modules = [
              import_module(module.name)
              for module in pkgutil.walk_packages(
                  package.__path__, package.__name__ + "."
              )
          ]
          assert installed_modules
          for runtime_module in installed_modules:
              runtime_module_file = Path(runtime_module.__file__).resolve()
              assert not runtime_module_file.is_relative_to(source_root), (
                  runtime_module_file
              )
              assert runtime_module_file.is_relative_to(venv_root), (
                  runtime_module_file
              )
          for runtime_module in (
              broker_audit,
              historical_router,
              odoo_approver_authorizer,
              systemd_activation,
              trusted_approval_uds,
              trusted_authority,
              trusted_authority_bootstrap,
              trusted_authority_sqlite,
              trusted_broker,
              trusted_broker_app,
              trusted_broker_main,
              trusted_broker_uds,
              trusted_idempotency,
              trusted_read,
              trusted_response_verifier,
              trusted_session_mint_uds,
              trusted_session_sqlite,
              verified_release,
              write_api,
              write_app,
              write_protocol,
              write_receipts,
              write_runtime,
              write_service,
              write_semantics,
              write_bootstrap,
              write_handlers,
              write_precheck,
              write_runner,
          ):
              runtime_module_file = Path(runtime_module.__file__).resolve()
              assert not runtime_module_file.is_relative_to(source_root), (
                  runtime_module_file
              )
              assert runtime_module_file.is_relative_to(venv_root), (
                  runtime_module_file
              )
          expected_version = os.environ["EXPECTED_VERSION"]
          assert package.__version__ == expected_version
          assert metadata.version("odoo-accounting-cli-v3") == expected_version
          assert resources.files("odoo_accounting_cli_v3").joinpath(
              "data", "capabilities.json"
          ).is_file()
          assert SCHEMA_VERSION == 4
          with TemporaryDirectory(prefix="odoo-cli-v3-wheel-state-") as value:
              state_root = Path(value)
              state_root.chmod(0o700)
              state = SQLitePersistence(state_root / "state.sqlite3")
              assert state.verify_chain() == 0
          PY

          "$runtime_cli" --help >/dev/null 2> help.stderr
          test ! -s help.stderr
          "$runtime_broker" --help > broker-help.stdout 2> broker-help.stderr
          test ! -s broker-help.stderr
          grep -Fxq \
            'usage: odoo-accounting-cli-v3-broker --config ABSOLUTE_PATH' \
            broker-help.stdout
          version_output="$("$runtime_cli" --version 2> version.stderr)"
          test ! -s version.stderr
          test "$version_output" = \
            "odoo-accounting-cli-v3, version $EXPECTED_VERSION"
          "$runtime_cli" registry list \
            > registry-list.json 2> registry-list.stderr
          test ! -s registry-list.stderr
          "$runtime_cli" registry get \
            --capability-id acct.gl.trial_balance.v1 \
            > registry-get.json 2> registry-get.stderr
          test ! -s registry-get.stderr

          set +e
          "$runtime_cli" registry get \
            --capability-id acct.unknown.missing.v1 \
            > unknown.stdout 2> unknown.stderr
          unknown_status=$?
          operation_request="$(
            "$runtime_python" -I - <<'PY'
          import json

          request = {
              "context": {
                  "allowed_company_ids": [7],
                  "audience": "odoo-accounting-cli-v3",
                  "auth_expires_at": "2026-07-15T08:05:00Z",
                  "auth_issued_at": "2026-07-15T08:00:00Z",
                  "auth_key_id": "wheel-smoke-write-auth-v2",
                  "auth_request_digest": "a" * 64,
                  "auth_signature": "b" * 64,
                  "auth_signature_purpose": "write_action_context_v2",
                  "auth_signature_version": 2,
                  "auth_token_id": "wheel-smoke-token",
                  "company_id": 7,
                  "database_name": "wheel_smoke_sandbox",
                  "database_uuid": "11111111-1111-4111-8111-111111111111",
                  "environment": "sandbox",
                  "odoo_instance_id": "odoo19@wheel-smoke",
                  "principal": "pi:wheel-smoke",
                  "user_id": 42,
              },
              "operation_id": "op-wheel-smoke",
              "request_id": "req-wheel-smoke",
              "capability_id": "acct.bill.vendor_create.v1",
              "parameters": {},
          }
          print(
              json.dumps(
                  request,
                  ensure_ascii=False,
                  allow_nan=False,
                  sort_keys=True,
                  separators=(",", ":"),
              )
          )
          PY
          )"
          "$runtime_cli" operation prepare \
            --request-json "$operation_request" \
            > operation.stdout 2> operation.stderr
          operation_status=$?
          set -e
          test "$unknown_status" -eq 4
          test "$operation_status" -eq 3
          test ! -s unknown.stdout
          test ! -s operation.stdout

          "$runtime_python" -I - <<'PY'
          import json
          from pathlib import Path

          listed = json.loads(Path("registry-list.json").read_text("utf-8"))
          fetched = json.loads(Path("registry-get.json").read_text("utf-8"))
          unknown = json.loads(Path("unknown.stderr").read_text("utf-8"))
          operation = json.loads(Path("operation.stderr").read_text("utf-8"))
          capabilities = listed["data"]["capabilities"]
          assert listed["ok"] is True
          assert listed["command"] == "registry.list"
          assert listed["data"]["count"] == len(capabilities) > 0
          assert [item["id"] for item in capabilities] == sorted(
              item["id"] for item in capabilities
          )
          assert fetched["ok"] is True
          assert fetched["data"]["capability"]["id"] == (
              "acct.gl.trial_balance.v1"
          )
          assert fetched["data"]["registry_digest"] == (
              listed["data"]["registry_digest"]
          )
          assert unknown["ok"] is False
          assert unknown["command"] == "registry.get"
          assert unknown["error"]["code"] == "capability_not_found"
          assert unknown["error"]["odoo_action_performed"] is False
          assert operation["ok"] is False
          assert operation["command"] == "operation.prepare"
          assert operation["error"]["code"] == "write_lifecycle_rejected"
          assert operation["error"]["odoo_effect"] == "none"
          assert operation["error"]["operation_id"] == "op-wheel-smoke"
          assert operation["error"]["retryable"] is False
          PY
